# protocol-droid — document→Markdown conversion service (Docker).
# Redis queue + enqueue API + scalable marker workers. Converts a corpus to
# prepare it for a downstream ingestion pipeline (it does not chunk/embed/index).
#
#   docker compose up -d --build                 # start (2 workers)
#   docker compose up -d --scale worker=4         # scale workers
#   docker compose run --rm api python enqueue_batch.py /data/input   # bulk enqueue
#   docker compose logs -f worker
#   docker compose down
#
# Put source docs under ${MARKER_INPUT:-./input}; results land in
# ${MARKER_OUTPUT:-./output}. Models cache in the `models` volume (first run
# downloads several GB). GPU only applies on a CUDA host (see the worker note).
#
# The API listens on ${API_BIND:-127.0.0.1}:8000 — localhost only by default,
# because without PROTOCOL_DROID_TOKEN it is unauthenticated. To expose it, set
# BOTH in .env: PROTOCOL_DROID_TOKEN=<long random secret> and API_BIND=0.0.0.0
# (callers then send `Authorization: Bearer <token>`).
#
# Redis requires AUTH when REDIS_PASSWORD is set; `protocol-droid.sh service
# deploy` generates one into .env on first deploy. A plain `docker compose up`
# without it runs Redis without a password (still unpublished, compose network
# only). The password reaches redis-server through a config file, not argv.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
          exec redis-server /tmp/redis.conf
        fi
        exec redis-server
    volumes:
      - redis-data:/data

  api:
    build: .
    image: marker-service:latest   # one tag for compose, `service build` and the k8s manifests
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      INPUT_DIR: /data/input
      OUTPUT_DIR: /data/output
      RESULT_TTL: ${RESULT_TTL:-86400}
      PROTOCOL_DROID_TOKEN: ${PROTOCOL_DROID_TOKEN:-}
      # The LLM `use_llm` talks to. Deployment configuration on purpose: a
      # request may only ask for an LLM, never name one. Unset = use_llm is
      # refused with a message, rather than reaching for Google Gemini.
      LLM_SERVICE: ${LLM_SERVICE:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - "${MARKER_INPUT:-./input}:/data/input"
      - "${MARKER_OUTPUT:-./output}:/data/output"
      - "models:/models"
    depends_on:
      - redis

  worker:
    build: .
    image: marker-service:latest   # one tag for compose, `service build` and the k8s manifests
    command: python worker.py
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      OUTPUT_DIR: /data/output
      # The same four as the api service, and for the same reason: the worker
      # re-validates every job, so a use_llm job the API accepted would be
      # refused here if only the API were configured. (This used to be
      # GOOGLE_API_KEY, left over from when use_llm meant Gemini — a key for a
      # service the worker can no longer be pointed at.)
      LLM_SERVICE: ${LLM_SERVICE:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - "${MARKER_INPUT:-./input}:/data/input"
      - "${MARKER_OUTPUT:-./output}:/data/output"
      - "models:/models"
    depends_on:
      - redis
    deploy:
      replicas: 2
      # GPU (uncomment on a host with the NVIDIA container runtime):
      # resources:
      #   reservations:
      #     devices:
      #       - driver: nvidia
      #         count: 1
      #         capabilities: [gpu]

volumes:
  redis-data: {}
  models: {}
