# One-shot bulk ingest: enqueues every supported file under /data/input onto the
# queue, then exits. The workers do the actual conversion (scale them for speed).
#   kubectl -n marker create -f batch-job.yaml         # run once
#   kubectl -n marker delete job/marker-batch          # clean up when done
# For a recurring backfill, wrap the same podspec in a CronJob instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: marker-batch
  namespace: marker
spec:
  backoffLimit: 1
  template:
    spec:
      # The image runs as uid/gid 1000 (`app`, see Dockerfile). fsGroup makes the
      # kubelet apply gid 1000 to the mounted PVCs, so the process can write
      # /data/output and the model cache; without it the volumes come up
      # root-owned and every write fails with EACCES. fsGroup is honoured by
      # CSI/in-tree drivers that manage ownership — on NFS-backed RWX shares set
      # the ownership (or no_root_squash + 1000:1000) on the server instead.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      restartPolicy: Never
      containers:
        - name: enqueue
          image: marker-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "enqueue_batch.py", "/data/input"]
          env:
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - { name: OUTPUT_DIR, value: "/data/output" }
            - { name: OUTPUT_FORMAT, value: "markdown" }
          volumeMounts:
            - { name: input, mountPath: /data/input }
      volumes:
        - name: input
          persistentVolumeClaim: { claimName: marker-input }
