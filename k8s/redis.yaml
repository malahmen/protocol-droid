# Redis requires AUTH: the password comes from the `marker-redis` Secret, which
# `protocol-droid.sh service deploy --target k8s` creates when it is missing.
# Applying by hand? Create it first:
#   kubectl -n marker create secret generic marker-redis --from-literal=password="$(openssl rand -hex 24)"
# The pod refuses to start without it. networkpolicy.yaml limits who can connect.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: marker
spec:
  replicas: 1
  selector:
    matchLabels: { app: marker-redis }
  template:
    metadata:
      labels: { app: marker-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Through a config file, not --requirepass: keeps the secret off argv.
          command: ["sh", "-c"]
          args:
            - printf 'requirepass %s\n' "$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: marker-redis, key: password }
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: marker
spec:
  selector: { app: marker-redis }
  ports:
    - port: 6379
      targetPort: 6379
