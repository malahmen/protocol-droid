# Scalable conversion workers. `replicas` IS your horizontal scale — each worker
# loads marker's models once and consumes jobs from the Redis queue.
#
# Image: build this repo's Dockerfile (`protocol-droid.sh service build
# --target k8s`) and make it available to the cluster (push to a registry, or
# `kind load` / `minikube image load`), then set it below. Default assumes a
# locally-loaded `marker-service:latest`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marker-worker
  namespace: marker
spec:
  replicas: 2
  selector:
    matchLabels: { app: marker-worker }
  template:
    metadata:
      labels: { app: marker-worker }
    spec:
      # The image runs as uid/gid 1000 (`app`, see Dockerfile). fsGroup makes the
      # kubelet apply gid 1000 to the mounted PVCs, so the process can write
      # /data/output and the model cache; without it the volumes come up
      # root-owned and every write fails with EACCES. fsGroup is honoured by
      # CSI/in-tree drivers that manage ownership — on NFS-backed RWX shares set
      # the ownership (or no_root_squash + 1000:1000) on the server instead.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      # --- GPU nodes (uncomment on a cluster with the NVIDIA device plugin) ---
      # nodeSelector: { "nvidia.com/gpu.present": "true" }
      # tolerations:
      #   - key: "nvidia.com/gpu"
      #     operator: "Exists"
      #     effect: "NoSchedule"
      containers:
        - name: worker
          image: marker-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          env:
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - { name: OUTPUT_DIR, value: "/data/output" }
            - { name: HF_HOME, value: "/models" }
          resources:
            # The OCR path spawns llama-server inside this container (surya's
            # llamacpp backend), so the surya GGUF + mmproj stay resident on top
            # of marker's own models: budget ~4Gi more than a text-layer-only
            # worker. Rough figures — measure your corpus and tighten them.
            requests: { cpu: "1", memory: "6Gi" }
            limits: { cpu: "4", memory: "12Gi" }
            # GPU: uncomment to request one GPU per worker.
            # limits:
            #   nvidia.com/gpu: 1
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: input, mountPath: /data/input }
            - { name: output, mountPath: /data/output }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: marker-models }
        - name: input
          persistentVolumeClaim: { claimName: marker-input }
        - name: output
          persistentVolumeClaim: { claimName: marker-output }
