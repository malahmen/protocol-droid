name: ci

# Stdlib only: the suite imports tasks.py directly and never loads marker,
# fastapi or redis, so it needs no services and no heavy dependencies.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax of every module
        run: python3 -m compileall -q api.py tasks.py worker.py enqueue_batch.py

      - name: tests
        run: python3 -m unittest discover -s tests -v
