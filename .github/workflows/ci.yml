name: ci

# `test` is stdlib only: the suite imports tasks.py directly and never loads
# marker, fastapi or redis, so it needs no services and no heavy dependencies.
# `markitdown-image` builds the one image small enough to build here and
# converts a document of each format in it; marker's (6.8 GB) is not built.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Versions
        run: |
          bash --version | head -1
          python3 --version
          shellcheck --version | sed -n 2p

      - name: Syntax of every module
        # Globbed, not listed: a named list quietly stops covering the next
        # module somebody adds.
        run: python3 -m compileall -q ./*.py pdroid

      - name: shellcheck
        # -S warning explicitly: SC2002 is off by default in shellcheck 0.11+
        # and on in older releases, so the floor has to be pinned or the runner
        # disagrees with the workstation.
        run: shellcheck -S warning -x protocol-droid.sh tests/*.sh

      - name: tests
        run: python3 -m unittest discover -s tests -v

      - name: bash tests
        # No converter is installed here; the suite stubs one on PATH.
        run: |
          tests/test-exit-codes.sh
          tests/test-k8s-storage.sh
          tests/test-container.sh


  markitdown-image:
    # The light image protocol runs for its markitdown queue (Dockerfile.
    # markitdown). Unlike marker's, it is small enough to build here (~430 MB),
    # so a markitdown bump that breaks a reader fails this job rather than a
    # conversion in protocol. Its own job: the stdlib suite above must not wait
    # on a pip install of the extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: docker build -f Dockerfile.markitdown -t markitdown-service:ci .

      - name: what is installed
        run: docker run --rm markitdown-service:ci

      - name: one document of each format, network off
        # The documents are generated inside the image; --network=none is part
        # of the check: the worker converts what it is handed and fetches nothing.
        run: docker run --rm -i --network=none markitdown-service:ci python - < tests/markitdown_image_check.py
